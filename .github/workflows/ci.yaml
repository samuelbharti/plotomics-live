# Continuous integration for Plotomics Live.
# Runs on pushes to the main development branches and on every pull request.
#
# Jobs:
#   frontend - installs npm dependencies, type-checks the TSX sources, and
#              builds the Vite bundle (www/app.js)
#   r-syntax - parses every R source file as a fast smoke test (this app has
#              no golem/testthat scaffolding yet, so this is the R-side gate)
#   markdown - lints Markdown files (config in .markdownlint.json)
on:
  push:
    branches: [main, master, dev]
  pull_request:

name: CI

permissions: read-all

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc
      - name: Build
        run: npm run build

  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Parse all R sources
        run: |
          files <- c("app.R", list.files("R", pattern = "[.]R$", full.names = TRUE))
          invisible(lapply(files, function(f) {
            tryCatch(parse(f), error = function(e) stop(f, ": ", conditionMessage(e)))
          }))
          cat("OK:", length(files), "files parsed\n")
        shell: Rscript {0}

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md
            !node_modules
